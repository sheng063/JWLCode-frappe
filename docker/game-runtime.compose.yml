# One fixed relay stack for all front-end games. No game Redis or per-release volumes.
name: jwl-game-universal
services:
  runtime:
    image: ${GAME_IMAGE:-jwlcode/game-universal:1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2567
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:?Configure the universal service once}
      FRAPPE_URL: http://frappe:8000
      FRAPPE_SITE: ${FRAPPE_SITE:-school.localhost}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-http://localhost:8000}
      GAME_MAX_ROOMS: ${GAME_MAX_ROOMS:-100}
      GAME_MAX_CONNECTIONS: ${GAME_MAX_CONNECTIONS:-256}
      GAME_MAX_CONNECTIONS_PER_USER: ${GAME_MAX_CONNECTIONS_PER_USER:-4}
      GAME_MAX_ROOMS_PER_USER: ${GAME_MAX_ROOMS_PER_USER:-2}
      GAME_ROOM_LIFETIME_SECONDS: ${GAME_ROOM_LIFETIME_SECONDS:-3600}
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    networks: [default, frappe]
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${GAME_BIND:-127.0.0.1}:${GAME_PORT:-2572}:8080"
    volumes:
      - ./game-runtime.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [runtime]
    mem_limit: 64m
networks:
  frappe:
    external: true
    name: ${FRAPPE_NETWORK:-jwl-learning_default}
