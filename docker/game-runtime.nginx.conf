map $http_upgrade $game_connection { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=game_match:1m rate=10r/s;
server {
    listen 8080;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    location / {
        limit_req zone=game_match burst=30 nodelay;
        proxy_pass http://runtime:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $game_connection;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
